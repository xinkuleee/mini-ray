name: Teaching branch baseline

on:
  push:
    branches: [teaching-base, teaching-enhanced]
  pull_request:
    branches: [teaching-base, teaching-enhanced]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base:
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'teaching-base') ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/teaching-base')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      UV_NO_PROGRESS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: false

      - name: Record candidate identity before dependency installation
        shell: bash
        run: python -c 'from scripts._ci_baseline import main; raise SystemExit(main(identity_only=True))'

      - name: Install frozen baseline dependencies
        shell: bash
        run: |
          mkdir -p baseline-evidence
          uv sync --frozen --extra test --python 3.12.13 2>&1 | tee baseline-evidence/sync.log

      - name: Record source and resolved environment
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          evidence = Path("baseline-evidence")
          evidence.mkdir(exist_ok=True)
          environment_python = Path(".venv/bin/python")
          python = str(environment_python.absolute()) if environment_python.exists() else sys.executable
          commands = [
              ["git", "rev-parse", "HEAD"],
              ["uname", "-a"],
              [python, "--version"],
              ["uv", "--version"],
              ["uv", "pip", "freeze", "--python", python],
          ]
          records = []
          for command in commands:
              try:
                  result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                          text=True, timeout=15)
                  record = {"command": command, "exit_code": result.returncode, "output": result.stdout}
              except (OSError, subprocess.TimeoutExpired) as exc:
                  record = {"command": command, "exit_code": None, "error": str(exc)}
              records.append(record)
          (evidence / "version.json").write_text(json.dumps(records, indent=2) + "\n", encoding="utf-8")
          (evidence / "version.txt").write_text(
              "\n".join("$ " + " ".join(record["command"]) + "\n"
                        + record.get("output", record.get("error", "")) for record in records), encoding="utf-8")
          for source in (Path("uv.lock"), Path("scripts/baseline_manifest.json")):
              if source.is_file():
                  shutil.copyfile(source, evidence / source.name)
          PY

      - name: Run this checkout's finite gate
        shell: bash
        run: .venv/bin/python -m scripts._ci_baseline

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: baseline-evidence/
          if-no-files-found: warn

  enhanced:
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'teaching-enhanced') ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/teaching-enhanced')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      UV_NO_PROGRESS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: false

      - name: Record candidate identity before dependency installation
        shell: bash
        run: python -c 'from scripts._ci_baseline import main; raise SystemExit(main(identity_only=True))'

      - name: Install frozen baseline dependencies
        shell: bash
        run: |
          mkdir -p baseline-evidence
          uv sync --frozen --extra test --python 3.12.13 2>&1 | tee baseline-evidence/sync.log

      - name: Record source and resolved environment
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          evidence = Path("baseline-evidence")
          evidence.mkdir(exist_ok=True)
          environment_python = Path(".venv/bin/python")
          python = str(environment_python.absolute()) if environment_python.exists() else sys.executable
          commands = [
              ["git", "rev-parse", "HEAD"],
              ["uname", "-a"],
              [python, "--version"],
              ["uv", "--version"],
              ["uv", "pip", "freeze", "--python", python],
          ]
          records = []
          for command in commands:
              try:
                  result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                          text=True, timeout=15)
                  record = {"command": command, "exit_code": result.returncode, "output": result.stdout}
              except (OSError, subprocess.TimeoutExpired) as exc:
                  record = {"command": command, "exit_code": None, "error": str(exc)}
              records.append(record)
          (evidence / "version.json").write_text(json.dumps(records, indent=2) + "\n", encoding="utf-8")
          (evidence / "version.txt").write_text(
              "\n".join("$ " + " ".join(record["command"]) + "\n"
                        + record.get("output", record.get("error", "")) for record in records), encoding="utf-8")
          for source in (Path("uv.lock"), Path("scripts/baseline_manifest.json")):
              if source.is_file():
                  shutil.copyfile(source, evidence / source.name)
          PY

      - name: Run this checkout's finite gate
        shell: bash
        run: .venv/bin/python -m scripts._ci_baseline

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-enhanced-${{ github.run_id }}-${{ github.run_attempt }}
          path: baseline-evidence/
          if-no-files-found: warn
